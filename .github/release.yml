# Groups the list of merged pull requests GitHub adds to release notes, by label. The notes themselves
# come from the version's section of CHANGELOG.md (see the release job in workflows/ci.yml).
changelog:
  exclude:
    labels: [skip-release-notes]
  categories:
    - title: New
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
