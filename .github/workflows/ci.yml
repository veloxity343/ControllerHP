name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Windows-targeted builds work on Linux via EnableWindowsTargeting.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PROJECT: src/ControllerHP/ControllerHP.csproj
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: dotnet build "$PROJECT" -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Publish (needs .NET 10 Desktop Runtime, or later)
        run: >
          dotnet publish "$PROJECT" -c Release -o out/framework
          -p:Version=${{ steps.version.outputs.version }}
          -p:PublishSingleFile=true -p:DebugType=none

      - name: Publish (standalone)
        run: >
          dotnet publish "$PROJECT" -c Release -o out/standalone
          -p:Version=${{ steps.version.outputs.version }}
          --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none

      - name: Package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir dist
          (cd out/framework && zip -q "../../dist/ControllerHP-$v-win-x64.zip" ControllerHP.exe)
          (cd out/standalone && zip -q "../../dist/ControllerHP-$v-win-x64-standalone.zip" ControllerHP.exe)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ControllerHP-${{ steps.version.outputs.version }}
          path: dist/*.zip

  # Runs what was just built on Windows, as a user would: both downloads list devices (none on the runner)
  # and draw every page of the settings window. Catches a build that starts but breaks, such as a
  # trimming or .NET change, before it can be released.
  test:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false

      # The .NET 10 Desktop Runtime for the smaller download; the standalone brings its own.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Run both downloads
        shell: pwsh
        run: |
          $failed = $false
          foreach ($zip in Get-ChildItem dist/*.zip) {
            $dir = Join-Path $PWD $zip.BaseName
            Expand-Archive $zip.FullName -DestinationPath $dir
            $exe = Join-Path $dir ControllerHP.exe
            foreach ($run in @(@('--list'), @('--preview-settings', (Join-Path $dir 'settings.png')))) {
              $p = Start-Process $exe -ArgumentList $run -PassThru -WindowStyle Hidden
              if (-not $p.WaitForExit(120000)) {
                $p.Kill()
                Write-Host "::error::$($zip.Name) $($run[0]) didn't finish in 2 minutes (an error dialog, or hung)"
                $failed = $true
              } elseif ($p.ExitCode -ne 0) {
                Write-Host "::error::$($zip.Name) $($run[0]) exited with $($p.ExitCode)"
                $failed = $true
              } else {
                Write-Host "$($zip.Name) $($run[0]): ok"
              }
            }
            if (-not (Test-Path (Join-Path $dir 'settings.png'))) {
              Write-Host "::error::$($zip.Name) drew no settings preview"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: settings-previews
          path: "*/settings.png"

  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      # The release notes are this version's section of CHANGELOG.md. A full release without one stops here
      # rather than publishing empty notes; pre-releases use the Unreleased section.
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { found = 1; next } found && (/^## \[/ || /^\[[^]]+\]: /) { exit } found' CHANGELOG.md; }
          notes="$(section "$version")"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            if [[ "$version" == *-* ]]; then
              notes="$(section Unreleased)"
            else
              echo "::error file=CHANGELOG.md::CHANGELOG.md has no section for $version. Add '## [$version] - <date>' with its changes, then push the tag again."
              exit 1
            fi
          fi
          printf '%s\n' "$notes" > release-notes.md
          cat release-notes.md

      # Third-party action, so pinned to a commit; Dependabot keeps it current.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          # The changelog section, followed by GitHub's list of merged pull requests and a comparison link.
          body_path: release-notes.md
          generate_release_notes: true
          # Tags like v1.2.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
